[project]
name = "reserving"
version = "1.0.0"
description = "Commercial auto claims reserving review: CAS Schedule P + SPLICE claim-level data"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
